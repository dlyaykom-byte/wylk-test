<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вулканизм: Спаси Алекса</title>
    <style>
        :root {
            --bg-start: #4a0404;
            --bg-end: #1a0000;
            --accent-orange: #ff6b35;
            --card-bg: rgba(50, 0, 0, 0.7);
            --text-primary: #fff5e6;
            --text-secondary: #ffa94d;
            --success: #28a745;
            --error: #dc3545;
            --border-radius: 20px;
            --font-main: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-main);
            background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-end) 100%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            position: relative;
        }

        /* Фиксированный хедер */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(26, 0, 0, 0.95);
            backdrop-filter: blur(10px);
            padding: 15px 20px;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent-orange);
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent-orange);
            margin: 0;
        }

        /* Аватар Алекса (инлайн SVG) */
        .avatar {
            width: 40px;
            height: 40px;
        }

        .progress-indicator {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .progress-dot {
            width: 12px;
            height: 12px;
            background: var(--text-secondary);
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        .progress-dot.active {
            background: var(--accent-orange);
            transform: scale(1.3);
            box-shadow: 0 0 10px var(--accent-orange);
        }

        /* Контент */
        .content-wrapper {
            margin-top: 90px;
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            flex: 1;
        }

        .story-card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 30px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 107, 53, 0.3);
            text-align: center;
            animation: fadeIn 0.5s ease;
            min-height: 300px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .story-text {
            font-size: 1.3rem;
            line-height: 1.6;
            font-weight: 500;
            margin-bottom: 30px;
            color: var(--text-primary);
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid var(--text-secondary);
            border-radius: var(--border-radius);
            padding: 20px;
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 15px;
            min-height: 60px;
            position: relative;
            overflow: hidden;
        }

        .option-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        .option-btn:hover:not(.disabled):not(.selected)::before {
            left: 100%;
        }

        .option-btn.correct {
            background: rgba(40, 167, 69, 0.3);
            border-color: var(--success);
            color: var(--success);
        }

        .option-btn.wrong {
            background: rgba(220, 53, 69, 0.3);
            border-color: var(--error);
            color: var(--error);
        }

        .option-btn.selected {
            pointer-events: none;
        }

        .option-label {
            font-weight: 800;
            color: var(--accent-orange);
            min-width: 30px;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 200;
            animation: fadeIn 0.3s ease;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 30px;
            border-radius: var(--border-radius);
            text-align: center;
            max-width: 500px;
            border: 1px solid var(--accent-orange);
        }

        .modal-text {
            font-size: 1.2rem;
            line-height: 1.5;
            margin-bottom: 25px;
            color: var(--text-primary);
        }

        .modal-btn {
            background: var(--accent-orange);
            color: #1a0000;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: 700;
            border-radius: var(--border-radius);
            cursor: pointer;
            transition: transform 0.2s;
        }

        .modal-btn:hover {
            transform: scale(1.05);
        }

        /* Финальный экран */
        .final-screen {
            text-align: center;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 40px;
        }

        .final-screen h2 {
            font-size: 2.5rem;
            color: var(--success);
        }

        .final-screen p {
            font-size: 1.3rem;
            color: var(--text-primary);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            .header h1 { font-size: 1.3rem; }
            .story-text { font-size: 1.1rem; }
            .option-btn { font-size: 1.1rem; padding: 18px; }
            .modal-text { font-size: 1.1rem; }
        }
    </style>
</head>
<body>

    <!-- Фиксированный хедер -->
    <div class="header">
        <h1>Спасательная операция: Исландия</h1>
        <!-- Инлайн SVG аватар Алекса в каске -->
        <svg class="avatar" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 12C14.2091 12 16 10.2091 16 8C16 5.79086 14.2091 4 12 4C9.79086 4 8 5.79086 8 8C8 10.2091 9.79086 12 12 12Z" fill="#ff6b35"/>
            <path d="M12 14C10.3431 14 9 15.3431 9 17V19H15V17C15 15.3431 13.6569 14 12 14Z" fill="#ff6b35"/>
            <path d="M4 20H20V22H4V20Z" fill="#ff6b35"/>
            <path d="M12 2C13.6569 2 15 3.34315 15 5V6C15 7.10457 14.1046 8 13 8H11C9.89543 8 9 7.10457 9 6V5C9 3.34315 10.3431 2 12 2Z" fill="#ff6b35"/>
            <path d="M19 11H5C4.44772 11 4 11.4477 4 12C4 12.5523 4.44772 13 5 13H19C19.5523 13 20 12.5523 20 12C20 11.4477 19.5523 11 19 11Z" fill="#ff6b35"/>
        </svg>
    </div>

    <div class="progress-indicator">
        <div class="progress-dot active" data-step="1"></div>
        <div class="progress-dot" data-step="2"></div>
        <div class="progress-dot" data-step="3"></div>
    </div>

    <!-- Основной контент -->
    <div class="content-wrapper">
        <div class="story-card" id="storyCard">
            <div class="story-text" id="storyText"></div>
            <div class="options-container" id="optionsContainer"></div>
        </div>
    </div>

    <!-- Финальный экран -->
    <div class="final-screen" id="finalScreen">
        <h2>Операция завершена!</h2>
        <p>Алекс в бетонном бункере. Пирокластический поток пронесся мимо. Геолог спасен!</p>
        <button class="option-btn" id="restartBtn" style="background: var(--accent-orange); color: #1a0000;">Пройти заново</button>
    </div>

    <!-- Модальное окно -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <div class="modal-text" id="modalText"></div>
            <button class="modal-btn" id="modalActionBtn"></button>
        </div>
    </div>

    <script>
        /* 
         * МЕТОДИЧЕСКИЙ КОНТЕКСТ ДЛЯ УЧИТЕЛЯ:
         * Квест проверяет знание терминологии вулканизма:
         * 1. Магма (под землей) vs Лава (на поверхности).
         * 2. Взрывное извержение (вязкая магма, пепел, пирокластика) vs Эффузивное.
         * 3. Пирокластический поток (главная угроза) vs Лахар.
         */

        const steps = [
            {
                id: 1,
                text: "Алекс у подножия вулкана. Из жерла поднимается раскаленная масса. Он спрашивает: то, что летит в воздух и течет по склону — это магма или лава?",
                options: [
                    {label: "А", text: "Это магма, потому что она в движении.", isCorrect: false, explanation: "Ошибка! Магма находится под землей. Как только она изливается на поверхность, она становится лавой."},
                    {label: "Б", text: "То, что выходит на поверхность — это лава, а под землей была магма.", isCorrect: true, explanation: "Верно! Лава — это магма, которая потеряла растворенные газы при выходе на поверхность."},
                    {label: "В", text: "Это одно и то же, разницы нет.", isCorrect: false, explanation: "Ошибка! Это базовое различие в вулканологии, определяющее место нахождения расплава."}
                ]
            },
            {
                id: 2,
                text: "Раздается взрыв, в небо поднимается облако пепла. С каким типом извержения имеет дело Алекс?",
                options: [
                    {label: "А", text: "Спокойное извержение, как на Гавайях. Бояться нечего.", isCorrect: false, explanation: "Ошибка! Взрыв и столб пепла — признаки взрывного извержения вязкой (кислой) магмы, а не спокойного базальтового."},
                    {label: "Б", text: "Взрывное извержение вязкой магмы. Оно опасно из-за газов, пирокластических потоков и пепла.", isCorrect: true, explanation: "Верно! Вязкая магма закупоривает жерло, давление газов растет, что приводит к катастрофическому взрыву."},
                    {label: "В", text: "Это извержение подводного вулкана.", isCorrect: false, explanation: "Ошибка! Алекс находится на суше в Исландии, а не в океане."}
                ]
            },
            {
                id: 3,
                text: "По склону с огромной скоростью несется облако из раскаленных газов и пыли. Что это и куда бежать?",
                options: [
                    {label: "А", text: "Это лахар (грязевой поток). Бежать к реке.", isCorrect: false, explanation: "Ошибка! Лахар — это смесь воды и пепла. Первым при взрыве приходит пирокластический поток."},
                    {label: "Б", text: "Это пирокластический поток (700 км/ч). Срочно укрыться в бетонном бункере.", isCorrect: true, explanation: "Верно! Это самое смертоносное явление. Поток движется быстрее гоночного авто, температура > 300°C. Только герметичное укрытие."},
                    {label: "В", text: "Это просто пепел. Надеть маску и спокойно идти дальше.", isCorrect: false, explanation: "Ошибка! Пепел опасен для легких, но облако газов и пыли — это поток, который сожжет и раздавит."}
                ]
            }
        ];

        let currentStepIndex = 0;
        let modalAction = 'next';

        const storyCard = document.getElementById('storyCard');
        const storyText = document.getElementById('storyText');
        const optionsContainer = document.getElementById('optionsContainer');
        const progressDots = document.querySelectorAll('.progress-dot');
        const modalOverlay = document.getElementById('modalOverlay');
        const modalText = document.getElementById('modalText');
        const modalActionBtn = document.getElementById('modalActionBtn');
        const finalScreen = document.getElementById('finalScreen');
        const restartBtn = document.getElementById('restartBtn');

        function renderStep() {
            if (currentStepIndex >= steps.length) {
                showFinalScreen();
                return;
            }

            const step = steps[currentStepIndex];
            storyText.textContent = step.text;
            
            // Обновляем прогресс
            progressDots.forEach(dot => {
                const stepNum = parseInt(dot.dataset.step);
                if (stepNum === step.id) {
                    dot.classList.add('active');
                } else {
                    dot.classList.remove('active');
                }
            });

            optionsContainer.innerHTML = '';
            
            step.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = `<span class="option-label">${opt.label}</span> ${opt.text}`;
                btn.onclick = () => handleAnswer(opt);
                optionsContainer.appendChild(btn);
            });
        }

        function handleAnswer(selectedOption) {
            const step = steps[currentStepIndex];
            const buttons = optionsContainer.querySelectorAll('.option-btn');

            // Блокируем интерфейс
            buttons.forEach(btn => btn.classList.add('disabled'));
            buttons.forEach(btn => btn.classList.remove('correct', 'wrong'));

            // Находим кнопку для подсветки
            const selectedBtn = Array.from(buttons).find(btn => btn.querySelector('.option-label').textContent === selectedOption.label);
            
            if (selectedOption.isCorrect) {
                selectedBtn.classList.add('correct');
                modalText.textContent = selectedOption.explanation;
                modalAction = 'next';
                modalActionBtn.textContent = 'Дальше';
            } else {
                selectedBtn.classList.add('wrong');
                modalText.textContent = selectedOption.explanation;
                modalAction = 'retry';
                modalActionBtn.textContent = 'Попробовать снова';
            }

            modalOverlay.style.display = 'flex';
        }

        function showFinalScreen() {
            storyCard.style.display = 'none';
            finalScreen.style.display = 'flex';
        }

        function resetQuiz() {
            currentStepIndex = 0;
            finalScreen.style.display = 'none';
            storyCard.style.display = 'block';
            renderStep();
        }

        // Обработчики
        modalActionBtn.addEventListener('click', () => {
            modalOverlay.style.display = 'none';
            if (modalAction === 'next') {
                currentStepIndex++;
                renderStep();
            } else if (modalAction === 'retry') {
                renderStep();
            }
        });

        restartBtn.addEventListener('click', resetQuiz);

        // Инициализация
        renderStep();
    </script>
</body>
</html>
